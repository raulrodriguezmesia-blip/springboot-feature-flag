# Automatic Retry System for Corrected Reports
# Processes incoming reports with GPG signature and hash validation
name: Retry System

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
  workflow_call:
    inputs:
      report_name:
        description: 'Name of report to retry'
        required: false
        type: string

permissions:
  contents: write
  issues: write

jobs:
  validate-and-process:
    runs-on: ubuntu-latest
    outputs:
      processed: ${{ steps.validate.outputs.processed }}
      accepted: ${{ steps.validate.outputs.accepted }}
      rejected: ${{ steps.validate.outputs.rejected }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Import GPG keys
        if: ${{ secrets.GPG_PRIVATE_KEY != '' }}
        run: |
          echo "${{ secrets.GPG_PRIVATE_KEY }}" | gpg --import
      
      - name: Validate incoming reports
        id: validate
        run: |
          PROCESSED=0
          ACCEPTED=0
          REJECTED=0
          
          if [ -d "reports/incoming" ]; then
            for REPORT in reports/incoming/*.pdf reports/incoming/*.html; do
              if [ -f "$REPORT" ]; then
                PROCESSED=$((PROCESSED + 1))
                BASENAME=$(basename "$REPORT")
                echo "Validating: $BASENAME"
                
                EXPECTED_HASH=$(jq -r ".reports[]? | select(.report==\"$BASENAME\") | .hash" reports/audit-log.json 2>/dev/null || echo "")
                
                if [ -n "$EXPECTED_HASH" ]; then
                  ACTUAL_HASH=$(sha256sum "$REPORT" | cut -d' ' -f1)
                  
                  if [ "$EXPECTED_HASH" = "$ACTUAL_HASH" ]; then
                    ACCEPTED=$((ACCEPTED + 1))
                    mv "$REPORT" reports/verified/ 2>/dev/null || true
                  else
                    REJECTED=$((REJECTED + 1))
                  fi
                else
                  echo "::warning::No audit entry for $BASENAME - cannot validate"
                fi
              fi
            done
          fi
          
          echo "processed=$PROCESSED" >> $GITHUB_OUTPUT
          echo "accepted=$ACCEPTED" >> $GITHUB_OUTPUT
          echo "rejected=$REJECTED" >> $GITHUB_OUTPUT
      
      - name: Commit changes
        if: steps.validate.outputs.processed > 0
        run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions Bot"
          git add -A
          git diff-index --quiet HEAD || git commit -m "Retry: Processed incoming reports [skip ci]"
          git push origin HEAD:${{ github.ref }} || echo "No changes to push"

  notify-retry:
    needs: validate-and-process
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Send notifications
        if: ${{ (secrets.SLACK_WEBHOOK_URL != '') || (secrets.TEAMS_WEBHOOK_URL != '') }}
        run: |
          ACCEPTED="${{ needs.validate-and-process.outputs.accepted }}"
          REJECTED="${{ needs.validate-and-process.outputs.rejected }}"
          MSG="🔄 Retry System ejecutado:
          - Aceptados: $ACCEPTED
          - Rechazados: $REJECTED"
          
          [ -n "${{ secrets.SLACK_WEBHOOK_URL }}" ] && curl -X POST -H "Content-type: application/json" --data "{\"text\":\"$MSG\"}" "${{ secrets.SLACK_WEBHOOK_URL }}"
          [ -n "${{ secrets.TEAMS_WEBHOOK_URL }}" ] && curl -X POST -H "Content-type: application/json" --data "{\"title\":\"Retry Completed\",\"text\":\"$MSG\"}" "${{ secrets.TEAMS_WEBHOOK_URL }}"
      - name: Log completion
        run: echo "Retry system completed at $(date -u +%Y-%m-%dT%H:%M:%SZ)"